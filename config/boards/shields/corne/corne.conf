# =========================
# SLEEP
# =========================

# Deep sleep después de 3 minutos de inactividad
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=180000


# =========================
# RGB UNDERGLOW
# =========================

CONFIG_ZMK_RGB_UNDERGLOW=y

# RGB encendido al arrancar
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# Efecto inicial
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=1

# Velocidad inicial
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=3

# Brillo inicial
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50


# =========================
# RGB BACKLIGHT
# =========================

CONFIG_ZMK_RGB_BACKLIGHT=n


# =========================
# SENSORES
# =========================

CONFIG_ZMK_SENSOR=n


# =========================
# BLUETOOTH
# =========================

CONFIG_ZMK_BLE=y
