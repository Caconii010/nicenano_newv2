# =========================
# SPLIT
# =========================

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y


# =========================
# BLUETOOTH + USB
# =========================

CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y


# =========================
# RGB
# =========================

CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_WS2812_STRIP_SPI=y
CONFIG_SPI=y


# =========================
# SLEEP
# =========================

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=180000
CONFIG_ZMK_USB_SUSPEND=y
CONFIG_ZMK_IDLE_SLEEP_DEEP=y


# =========================
# BLUETOOTH POWER
# =========================

CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_CTLR_TX_PWR_MINUS_8=y
